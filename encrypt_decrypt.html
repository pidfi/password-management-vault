<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
    <title>Offline Vault</title>
    <style>
        body { 
			font-family: Arial, sans-serif; 
			padding: 0px; 
			margin: 0px; 
            width: 100vw;
			height: 95vh;
			background: #f5f5f5; 
		}
		.statebox {
			display: flex;
			text-align: center;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
		}
		.btn {
			padding: 12px 24px; 
			cursor: pointer; 
			border: 0; 
			border-radius: 4px; 
			color: white; 
			font-weight: bold; 
			font-size: 16px; 
			margin: 1rem;
		}
        .btn-danger { 
			background: #8b0808; 
		}
        .btn-danger:hover { 
			background: #a80a0a; 
		}
        .btn-prim { 
			background: #333; 
		}
        .btn-prim:hover { 
			background: #555; 
		}
		.btn-sec { 
			background: #bbb; 
		}
        .btn-sec:hover { 
			background: #ccc; 
		}
		.btn-timer {
			margin: 5px;
		}
        #iframe-container iframe {
            width: 100vw;
			height: 80vh;
            border: none;
            display: block;
        }
		p {
			font-size: 18px;
			margin: 0;
		}
		#unlocked-state{
			display: none;
		}
		#xToCopy{
			position:fixed;
			left: -1000px;
			top: 0px;
			width: 1px;
			height: 1px;
			opacity: 0;
		}
    </style>
</head>
<body>
	<textarea id="xToCopy">x</textarea>   
	<div id="locked-state" class="statebox">
		<div>
			<p>The vault is currently locked. No sensitive data is in memory.</p>
			<button id="unlockVault" class="btn btn-prim">Unlock Vault</button>
			<button id="copyXtoClipboard" class="btn btn-sec">Copy 'x' to clipboard</button>
		</div>
	</div>
	
	<div id="unlocked-state" class="statebox">
		<div>
			<button id="lockVault" class="btn btn-danger">Lock Vault</button>
			<p>Auto-Lock in <span id="inactivityCountdown">2:00</span></p>
			<button class="btn btn-sec btn-timer" id="resetAutoLockTimer">Reset Auto-Lock timer</button>
			<div id="iframe-container"></div>
		</div>
	</div>

    <script>
        // The entire vault application logic and UI, isolated in a string.
        // This ensures the JS heap is completely separate from the parent page.
        const vaultAppHTML = `
			<!DOCTYPE html>
			<html lang="en">
				<head>
					<meta charset="UTF-8">
					<meta name="viewport" content="width=device-width, initial-scale=1.0">
					<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-ZYK/pRu6lBvsid+zXfJICiFqarCVC32v3WQeSGPNiRU='; style-src 'sha256-R0KyXyWfnAswDkQK+V2NyEFqUy7HyrnGR+JJ16OXsQA='; connect-src 'none'; img-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
					<title>Offline Vault</title>
					<style>
						body {
							font-family: Arial, sans-serif;
							width: calc(100% - 20px);
							margin: 10px;
							background: #f5f5f5;
						}
						h1 {
							margin-bottom: 5px;
						}
						.box {
							background: white;
							padding: 20px;
							border-radius: 8px;
							margin-bottom: 20px;
							box-shadow: 0 2px 8px rgba(0,0,0,.08);
						}
						label {
							display: block;
							font-weight: bold;
							margin-top: 12px;
						}
						input {
							width: 100%;
							box-sizing: border-box;
							padding: 10px;
							margin-top: 6px;
							font-family: monospace;
							border: 1px solid #bbb;
							border-radius: 4px;
						}
						button {
							padding: 10px 18px;
							margin: 5px 8px 0 0;
							cursor: pointer;
							border: 0;
							border-radius: 4px;
							background: #333;
							color: white;
						}
						button:hover {
							background: #555;
						}
						#status {
							margin-top: 15px;
							font-weight: bold;
						}
						.info {
							font-size: 14px;
							color: #555;
						}
						.warning {
							color: #9a5700;
						}
						.flexbox{
							display:flex;
						}
						.btn-secondary{
							background-color: #8b0808;
						}
						.half-width{
							width: 50%;
						}
					</style>
				</head>
				<body>
					<div class="container">
						<h1>Offline Vault</h1>
						<p class="info">AES-256-GCM · PBKDF2-SHA-256 · 256-Bit-Salt · 96-Bit-IV</p>
						<div class="box">
							<label for="password">Master password</label>
							<input id="password" type="password" autocomplete="off" spellcheck="false">
							<div class="flexbox">
								<div class="half-width">
									<label for="plaintextInput">Plaintext</label>
									<input id="plaintextInput" type="text" autocomplete="off" spellcheck="false">
									<button id="encryptData">Encrypt</button>
									<label for="ciphertextOutput">Ciphertext</label>
									<input id="ciphertextOutput" type="text" autocomplete="off" spellcheck="false">
									<button id="copyCiphertext">Copy</button>
								</div>
								<div class="half-width">
									<label for="ciphertextInput">Ciphertext</label>
									<input id="ciphertextInput" type="text" autocomplete="off" spellcheck="false">
									<button id="decryptData">Decrypt</button>
									<label for="plaintextOutput">Plaintext</label>
									<input id="plaintextOutput" type="text" autocomplete="off" spellcheck="false">
									<button id="copyPlaintext">Copy</button>
								</div>
							</div>
							<div id="status"></div>
						</div>
						<div class="box">
							<strong>Information</strong>
							<p class="info">
								The salt and the IV are saved together with the Ciphertext. They don't have to be secret.
							</p>
							<p class="info">
								For every encryption a new salt and IV is being used. That's why the same plaintext and master password generate a new ciphertext every time.
							</p>
						</div>
					</div>
					<script>
						/*
						==========================================================
							Offline Vault V4
						==========================================================
						Cryptography:
							Password
								|
								v
							PBKDF2-HMAC-SHA-256
								|
								| iterations
								v
							256 Bit AES Key
								|
								v
							AES-256-GCM
								|
								+-- random 96 bit IV
								|
								+-- random 256 bit Salt
						Format:
							ITERATIONS.SALT.IV.CIPHERTEXT

						All binary parts are base64-encoded.
						Example:
							600000.<salt>.<iv>.<ciphertext>
						Iterations are part of the result, to decrypt ciphertexts, even
						if the iterations default value got adjusted.
						==========================================================
						*/
						/*
						 * -------------------------------------------------------
						 * Current default value for new encryptions
						 * -------------------------------------------------------
						 */
						const DEFAULT_PBKDF2_ITERATIONS = 600000;
						/*
						 * AES-256-GCM
						 */
						const AES_KEY_LENGTH = 256;
						/*
						 * Salt = 32 Byte = 256 Bit
						 */
						const SALT_LENGTH = 32;
						/*
						 * GCM IV = 12 Byte = 96 Bit
						 */
						const IV_LENGTH = 12;
						/*
						 * -------------------------------------------------------
						 * Base64
						 * -------------------------------------------------------
						 */
						function toBase64(bytes) {
							let binary = "";
							const chunkSize = 0x8000;
							for (let i = 0; i < bytes.length; i += chunkSize) {
								const chunk = bytes.subarray(i, Math.min(i + chunkSize, bytes.length));
								binary += String.fromCharCode.apply(null, chunk);
							}
							return btoa(binary);
						}
						function fromBase64(base64) {
							const binary = atob(base64);
							const bytes = new Uint8Array(binary.length);
							for (let i = 0; i < binary.length; i++) {
								bytes[i] = binary.charCodeAt(i);
							}
							return bytes;
						}
						/*
						 * -------------------------------------------------------
						 * Buttons
						 * -------------------------------------------------------
						 */
						document.getElementById("encryptData").addEventListener("click", encryptData);
						document.getElementById("decryptData").addEventListener("click", decryptData);
						document.getElementById("copyPlaintext").addEventListener("click", copyPlaintext);
						document.getElementById("copyCiphertext").addEventListener("click", copyCiphertext);
						/*
						 * -------------------------------------------------------
						 * Password → AES-Key
						 * -------------------------------------------------------
						 */
						async function deriveKey(passwordBytes, salt, iterations) {
							const keyMaterial = await crypto.subtle.importKey(
								"raw",
								passwordBytes,
								{ 
									name: "PBKDF2" 
								},
								false,
								[
									"deriveKey"
								]
							);
							/*
							 * PBKDF2 → AES-256
							 */
							return crypto.subtle.deriveKey(
								{
									name: "PBKDF2",
									salt: salt,
									iterations: iterations,
									hash: "SHA-256"
								},
								keyMaterial,
								{ 
									name: "AES-GCM", 
									length: AES_KEY_LENGTH 
								},
								false,
								[
									"encrypt", 
									"decrypt"
								]
							);
						}
						/*
						 * -------------------------------------------------------
						 * Status
						 * -------------------------------------------------------
						 */
						function setStatus(message, error = false) {
							const element = document.getElementById("status");
							element.textContent = message;
							element.style.color = error ? "#b00020" : "#146b2e";
						}
						/*
						 * -------------------------------------------------------
						 * Encryption
						 * -------------------------------------------------------
						 */
						async function encryptData() {
						    let passwordBytes = null;
							let plaintextBytes = null;
							let salt = null;
							let iv = null;
							let key = null;
							try {
								const passwordEl = document.getElementById("password");
								const plaintextEl = document.getElementById("plaintextInput");
								
								// Convert to Uint8Array immediately and clear DOM to prevent lingering strings
								passwordBytes = new TextEncoder().encode(passwordEl.value);
								plaintextBytes = new TextEncoder().encode(plaintextEl.value);
								clearAll();
								setStatus("Encryption is starting...");
								
								if (passwordBytes.length === 0) {
									passwordBytes.fill(0); 
									plaintextBytes.fill(0);
									setStatus("Master password is missing.", true);
									return;
								}
								if (plaintextBytes.length === 0) {
									passwordBytes.fill(0); 
									plaintextBytes.fill(0);
									setStatus("Plaintext is missing.", true);
									return;
								}
								const iterations = DEFAULT_PBKDF2_ITERATIONS;
								/*
								 * Random 256-Bit-Salt.
								 */
								salt = crypto.getRandomValues(new Uint8Array(SALT_LENGTH));
								/*
								 * Random 96-Bit-IV.
								 *
								 * Each encryption gets its own IV.
								 */
								iv = crypto.getRandomValues(new Uint8Array(IV_LENGTH));
								/*
								 * Get key
								 */
								key = await deriveKey(passwordBytes, salt, iterations);
								passwordBytes.fill(0); // Scrub password from memory
								/*
								 * AES-256-GCM
								 */
								const encryptedBuffer = await crypto.subtle.encrypt(
									{ 
										name: "AES-GCM", 
										iv: iv, 
										tagLength: 128 
									},
									key,
									plaintextBytes
								);
								plaintextBytes.fill(0); // Scrub plaintext from memory
								const encryptedBytes = new Uint8Array(encryptedBuffer);
								// Format: ITERATIONS.SALT.IV.CIPHERTEXT
								const result = 
									iterations + 
									"." + 
									toBase64(salt) + 
									"." + 
									toBase64(iv) + 
									"." + 
									toBase64(encryptedBytes);
								document.getElementById("ciphertextOutput").value = result;
								setStatus("Encryption successful.");
							} catch (error) {
								console.error(error);
								setStatus("Encryption failed.", true);
							} finally {
								// Scrub all sensitive data
								if (passwordBytes) passwordBytes.fill(0);
								if (plaintextBytes) plaintextBytes.fill(0);
								if (salt) salt.fill(0);
								if (iv) iv.fill(0);
								
								key = null;
								passwordBytes = null;
								plaintextBytes = null;
								salt = null;
								iv = null;
							}
						}
						/*
						 * -------------------------------------------------------
						 * Decryption
						 * -------------------------------------------------------
						 */
						async function decryptData() {
							let passwordBytes = null;
							let salt = null;
							let iv = null;
							let encryptedBytes = null;
							let plaintextBytes = null;
							let key = null;
							try {
								const passwordEl = document.getElementById("password");
								const ciphertextEl = document.getElementById("ciphertextInput");
								
								passwordBytes = new TextEncoder().encode(passwordEl.value);
								const input = ciphertextEl.value.trim();
								clearAll();
								setStatus("Decryption is starting...");

								if (passwordBytes.length === 0) {
									passwordBytes.fill(0);
									setStatus("Master password is missing.", true);
									return;
								}
								/*
								 * Split:
								 *
								 * ITERATIONS
								 * SALT
								 * IV
								 * CIPHERTEXT
								 */
								const parts = input.split(".");
								if (parts.length !== 4) {
									passwordBytes.fill(0);
									setStatus("Invalid ciphertext.", true);
									return;
								}
								/*
								 * Get number of iterations from encrypted text.
								 */
								const iterations = Number(parts[0]);
								if (!Number.isSafeInteger(iterations)) {
									passwordBytes.fill(0);
									setStatus("Invalid PBKDF2 iterations.", true);
									return;
								}
								/*
								 * Salt
								 */
								salt = fromBase64(parts[1]);
								/*
								 * IV
								 */
								iv = fromBase64(parts[2]);
								/*
								 * Ciphertext + authentication tag
								 */
								encryptedBytes = fromBase64(parts[3]);
								/*
								 * Check Salt-Length
								 */
								if (salt.length !== SALT_LENGTH) {
									passwordBytes.fill(0);
									setStatus("Invalid salt.", true);
									return;
								}
								/*
								 * Check IV-length
								 */
								if (iv.length !== IV_LENGTH) {
									passwordBytes.fill(0);
									setStatus("Invalid IV.", true);
									return;
								}
								/*
								 * AES-GCM needs at least 128-Bit Authentication Tag.
								 *
								 * Since Web Crypto adds the tag to the ciphertext, 
								 * there have to be at least 16 bytes.
								 */
								if (encryptedBytes.length < 16) {
									passwordBytes.fill(0);
									setStatus("Invalid Ciphertext.", true);
									return;
								}
								key = await deriveKey(passwordBytes, salt, iterations);
								passwordBytes.fill(0);
								const decryptedBuffer = await crypto.subtle.decrypt(
									{ 
										name: "AES-GCM", 
										iv: iv, 
										tagLength: 128 
									},
									key,
									encryptedBytes
								);
								plaintextBytes = new Uint8Array(decryptedBuffer);
								/*
								 * UTF-8 → Text
								 */
								const plaintext = new TextDecoder("utf-8", { fatal: true }).decode(plaintextBytes);
								plaintextBytes.fill(0); // Scrub decrypted plaintext
								document.getElementById("plaintextOutput").value = plaintext;
								setStatus("Decryption successful.");
							} catch (error) {
								console.error(error);
								setStatus("Decryption failed.", true);
							} finally {
								// Scrub all sensitive data
								if (passwordBytes) passwordBytes.fill(0);
								if (salt) salt.fill(0);
								if (iv) iv.fill(0);
								if (encryptedBytes) encryptedBytes.fill(0);
								if (plaintextBytes) plaintextBytes.fill(0);
								key = null;
								passwordBytes = null;
								salt = null;
								iv = null;
								encryptedBytes = null;
								plaintextBytes = null;
							}
						}
						/*
						 * -------------------------------------------------------
						 * Copy ciphertext
						 * -------------------------------------------------------
						 */
						async function copyCiphertext() {
							const element = document.getElementById("ciphertextOutput");
							if (!element.value) {
								setStatus("No encrypted ciphertext found.", true);
								return;
							}
							try {
								await navigator.clipboard.writeText(element.value);
								clearAll();
								setStatus("Ciphertext copied.");
							} catch (error) {
							    element.select();
								element.setSelectionRange(0, element.value.length);
							    const success = document.execCommand("copy");
							    if(success){
									clearAll();
									setStatus("Ciphertext copied.");
								}else{
									setStatus("Copy failed. Please copy manually.");
								}
						    }
						}
						/*
						 * -------------------------------------------------------
						 * Copy plaintext
						 * -------------------------------------------------------
						 */
						async function copyPlaintext() {
							const element = document.getElementById("plaintextOutput");
							if (!element.value) {
								setStatus("No decrypted plaintext found.", true);
								return;
							}
							try {
								await navigator.clipboard.writeText(element.value);
								clearAll();
								setStatus("Plaintext copied.");
							} catch (error) {
							    element.select();
								element.setSelectionRange(0, element.value.length);
							    const success = document.execCommand("copy");
								if(success){
									clearAll();
									setStatus("Plaintext copied.");
								}else{
									setStatus("Copy failed. Please copy manually.");
								}
						    }
						}
						/*
						 * -------------------------------------------------------
						 * Clear all
						 * -------------------------------------------------------
						 */
						function clearAll() {
							document.getElementById("password").value = "";
							document.getElementById("plaintextInput").value = "";
							document.getElementById("plaintextOutput").value = "";
							document.getElementById("ciphertextInput").value = "";
							document.getElementById("ciphertextOutput").value = "";
							setStatus("");
						}
						/*
						 * -------------------------------------------------------
						 * Reset auto-lock timer in parent element
						 * -------------------------------------------------------
						 */
						function notifyActivity() {
							window.parent.postMessage('vault-activity', '*');
						}
						document.addEventListener('click', (event) => {
							if (event.target.closest('button')) {
								notifyActivity();
							}
						});
						document.addEventListener('input', event => {
							if (event.target.closest('input')) {
								notifyActivity();
							}
						});
					<\/script>
				</body>
			</html>
        `;
		const iframeContainer = document.getElementById('iframe-container');
        const lockedState = document.getElementById('locked-state');
        const unlockedState = document.getElementById('unlocked-state');
		const inactivityCountdown = document.getElementById('inactivityCountdown');
		let inactivityTimer = null;
		let countdownInterval = null;
		let lastActivityTime = 0;
		const INACTIVITY_TIMEOUT_MS = 2 * 60 * 1000;
		function resetInactivityTimer() {
			if (unlockedState.style.display === 'none') return;
			lastActivityTime = Date.now();
			updateCountdown(INACTIVITY_TIMEOUT_MS);
			clearTimeout(inactivityTimer);
			inactivityTimer = setTimeout(lockVault, INACTIVITY_TIMEOUT_MS);
		}
		function startCountdown() {
			clearTimeout(inactivityTimer);
			clearInterval(countdownInterval);
			lastActivityTime = Date.now();
			inactivityTimer = setTimeout(lockVault, INACTIVITY_TIMEOUT_MS);
			updateCountdown(INACTIVITY_TIMEOUT_MS);
			countdownInterval = setInterval(() => {
				const elapsed = Date.now() - lastActivityTime;
				const remaining = INACTIVITY_TIMEOUT_MS - elapsed;
				updateCountdown(Math.max(remaining, 0));
			}, 1000);
		}
		function stopInactivityTimer() {
			clearTimeout(inactivityTimer);
			clearInterval(countdownInterval);
			inactivityTimer = null;
			countdownInterval = null;
			lastActivityTime = 0;
			updateCountdown(0);
		}
		function updateCountdown(ms) {
			const totalSeconds = Math.ceil(ms / 1000);
			const minutes = Math.floor(totalSeconds / 60);
			const seconds = totalSeconds % 60;
			inactivityCountdown.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
		}
		resetAutoLockTimer.addEventListener('click', resetInactivityTimer);
		window.addEventListener('message', event => {
			if (event.origin === "null" && event.data === 'vault-activity') {
				resetInactivityTimer();
			}
		});
		document.getElementById("lockVault").addEventListener("click", lockVault);
		document.getElementById("unlockVault").addEventListener("click", unlockVault);
		document.getElementById("copyXtoClipboard").addEventListener("click", copyXtoClipboard);
        function unlockVault() {
			startCountdown();
            lockedState.style.display = 'none';
            unlockedState.style.display = 'flex';
            const newFrame = document.createElement('iframe');
            newFrame.id = 'vault-frame';
            newFrame.sandbox = 'allow-scripts';
            newFrame.allow = "clipboard-write";
            iframeContainer.appendChild(newFrame);
            newFrame.srcdoc = vaultAppHTML;
        }
        function lockVault() {
			stopInactivityTimer();
            iframeContainer.innerHTML = '';
            lockedState.style.display = 'flex';
            unlockedState.style.display = 'none';
		}
		async function copyXtoClipboard() {
			try {
				await navigator.clipboard.writeText("x");
			} catch (error) {
				const textarea = document.getElementById('xToCopy');
				textarea.focus();
				textarea.select();
				textarea.setSelectionRange(0, textarea.value.length); 
				document.execCommand("copy");
			}
		}
    </script>
</body>
</html>
